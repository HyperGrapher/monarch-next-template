name: Verify
description: >-
  Type check, lint, integration tests (incl. the schema-drift guard) and end-to-end tests against a production build.
  The job must provide TEST_DATABASE_URL (a throwaway Postgres, never a real database) and have the dependencies installed.
runs:
  using: composite
  steps:
    - name: Type check
      shell: bash
      run: pnpm exec tsc --noEmit

    - name: Lint
      shell: bash
      run: pnpm lint

    - name: Integration tests
      shell: bash
      run: pnpm test:int

    - name: Cache Next.js build cache
      uses: actions/cache@v6
      with:
        path: .next/cache
        key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
        restore-keys: |
          next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

    - name: Install Playwright browser
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - name: End-to-end tests (builds and starts the app on the test database)
      shell: bash
      run: pnpm test:e2e
